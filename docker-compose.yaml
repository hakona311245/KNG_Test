services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kng-fashion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://kng_user:kng_password@postgres:5432/kng_fashion?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: kng-fashion-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: kng_fashion
      POSTGRES_USER: kng_user
      POSTGRES_PASSWORD: kng_password
    ports:
      - "5432:5432"
    volumes:
      - kng_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kng_user -d kng_fashion"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: kng-fashion-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  backend_node_modules:
  kng_postgres_data:
